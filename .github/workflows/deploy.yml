name: Deploy to AWS

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/churchWorkflow-api

            git fetch origin

            # Force clean state
            git reset --hard
            git clean -fd

            # Checkout correct branch dynamically
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Install & build
            npm install
            npm run build

            # Restart app
            pm2 reload churchWorkflow-api || pm2 start dist/main.js --name churchWorkflow-api
            pm2 save
