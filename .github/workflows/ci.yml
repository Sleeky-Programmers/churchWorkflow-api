name: CI (Lint, Typecheck, Build)

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      # Fails on any lint error or warning
      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
